<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"  rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h3>Edit User</h3>
    <form id="editForm">
        <input type="hidden" id="userId">
        <div class="mb-3"><label>First Name</label><input class="form-control" id="firstName" required></div>
        <div class="mb-3"><label>Last Name</label><input class="form-control" id="lastName" required></div>
        <div class="mb-3"><label>Age</label><input type="number" class="form-control" id="age" required></div>
        <div class="mb-3"><label>Email</label><input class="form-control" id="email" required></div>
        <div class="mb-3"><label>Password</label><input type="password" class="form-control" id="password"></div>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');

    async function loadUser() {
        const res = await fetch(`/api/admin/users/${userId}`);
        return await res.json();
    }

    document.addEventListener("DOMContentLoaded", async () => {
        const user = await loadUser();
        document.getElementById('userId').value = user.id;
        document.getElementById('firstName').value = user.firstName;
        document.getElementById('lastName').value = user.lastName;
        document.getElementById('age').value = user.age;
        document.getElementById('email').value = user.email;
    });

    document.getElementById('editForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const user = {
            id: +document.getElementById('userId').value,
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            age: +document.getElementById('age').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };
        await fetch(`/api/admin/users/${user.id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(user)
        });
        window.location.href = '/admin';
    });
</script>
</body>
</html>
