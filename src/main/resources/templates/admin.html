<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta name="_csrf" content="${_csrf.token}" />
  <meta name="_csrf_header" content="${_csrf.headerName}" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"  rel="stylesheet">
  <style>
    .sidebar {
      position: fixed;
      top: 60px;
      bottom: 0;
      left: 0;
      width: 250px;
      padding: 20px;
      background-color: #f8f9fa;
      overflow-y: auto;
    }
    .content {
      margin-left: 250px;
      padding: 40px 20px;
    }
    .nav-link.active {
      background-color: #0d6efd !important;
      color: white !important;
    }
    .logout-btn {
      float: right;
      margin-top: 10px;
    }
    .user-info {
      background-color: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .nav-tabs {
      margin-bottom: 20px;
    }
    .table-container {
      background-color: white;
      border-radius: 5px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .table-responsive {
      height: calc(100vh - 160px);
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark sticky-top">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Admin Panel</span>
    <span class="navbar-text me-auto" sec:authentication="name"></span>
    <form class="logout-btn" th:action="@{/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit" class="btn btn-danger">Logout</button>
    </form>
  </div>
</nav>

<div class="d-flex">
  <!-- Sidebar -->
  <div class="sidebar">
    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link active" th:href="@{/admin}">Admin</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/user}">User</a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="content">
    <!-- User Info -->
    <div class="user-info">
      <span sec:authentication="name"></span> with roles:
      <span sec:authentication="principal.authorities"></span>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-tabs">
      <li class="nav-item">
        <a class="nav-link active" href="#">Users table</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" onclick="showNewUserForm()">New User</a>
      </li>
    </ul>

    <!-- Table Section -->
    <div class="table-container">
      <h3 class="mb-3">All users</h3>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>Role</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
          </thead>
          <tbody id="userTableBody">
          <!-- Данные будут загружены через JS -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- New User Form (Hidden by default) -->
    <div id="newUserFormSection" style="display: none;" class="table-container mt-4">
      <h3 class="mb-3">Add New User</h3>
      <form id="newUserForm">
        <div class="mb-3">
          <label for="newFirstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="newFirstName" name="firstName" required>
        </div>
        <div class="mb-3">
          <label for="newLastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="newLastName" name="lastName" required>
        </div>
        <div class="mb-3">
          <label for="newAge" class="form-label">Age</label>
          <input type="number" class="form-control" id="newAge" name="age" min="1" max="150" required>
        </div>
        <div class="mb-3">
          <label for="newEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="newEmail" name="email" required>
        </div>
        <div class="mb-3">
          <label for="newPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="newPassword" name="password" required>
        </div>
        <div class="mb-3">
          <label for="newRoles" class="form-label">Role</label>
          <select multiple class="form-select" id="newRoles" name="roles"></select>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <button type="button" class="btn btn-secondary ms-2" onclick="hideNewUserForm()">Cancel</button>
      </form>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Edit User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editUserForm">
          <input type="hidden" id="editUserId" name="id">
          <div class="mb-3">
            <label for="editFirstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="editFirstName" name="firstName" required>
          </div>
          <div class="mb-3">
            <label for="editLastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="editLastName" name="lastName" required>
          </div>
          <div class="mb-3">
            <label for="editAge" class="form-label">Age</label>
            <input type="number" class="form-control" id="editAge" name="age" min="1" max="150" required>
          </div>
          <div class="mb-3">
            <label for="editEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="editEmail" name="email" required>
          </div>
          <div class="mb-3">
            <label for="editRoles" class="form-label">Role</label>
            <select multiple class="form-select" id="editRoles" name="roles"></select>
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="deleteModalLabel">Delete user</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="user-details">
          <div><strong>ID:</strong> <span id="deleteUserId"></span></div>
          <div><strong>First name:</strong> <span id="deleteUserFirstName"></span></div>
          <div><strong>Last name:</strong> <span id="deleteUserLastName"></span></div>
          <div><strong>Age:</strong> <span id="deleteUserAge"></span></div>
          <div><strong>Email:</strong> <span id="deleteUserEmail"></span></div>
          <div><strong>Role:</strong> <span id="deleteUserRoles"></span></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Глобальные переменные для CSRF токенов
  const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
  const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

  let roles = [];

  // Загрузка пользователей
  function fetchAllUsers() {
    fetch('/api/admin/users')
            .then(response => response.json())
            .then(users => {
              const tbody = document.getElementById('userTableBody');
              tbody.innerHTML = '';

              users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.firstName}</td>
                    <td>${user.lastName}</td>
                    <td>${user.age}</td>
                    <td>${user.email}</td>
                    <td>${user.roles.map(r => r.name).join(', ')}</td>
                    <td><button class="btn btn-primary btn-sm" onclick="openEditModal(${JSON.stringify(user)})">Edit</button></td>
                    <td><button class="btn btn-danger btn-sm" onclick="openDeleteModal(${JSON.stringify(user)})">Delete</button></td>
                `;
                tbody.appendChild(row);
              });
            })
            .catch(error => console.error("Ошибка при загрузке пользователей:", error));
  }

  // Загрузка ролей
  function fetchAllRoles() {
    fetch('/api/admin/roles')
            .then(response => response.json())
            .then(data => {
              roles = data;
              fillRoleDropdowns();
            });
  }

  // Заполнение выпадающих списков ролями
  function fillRoleDropdowns() {
    ['newRoles', 'editRoles'].forEach(id => {
      const select = document.getElementById(id);
      select.innerHTML = '';
      roles.forEach(role => {
        const option = document.createElement('option');
        option.value = role;
        option.textContent = role;
        select.appendChild(option);
      });
    });
  }

  // Открытие модального окна редактирования
  function openEditModal(user) {
    document.getElementById('editUserId').value = user.id;
    document.getElementById('editFirstName').value = user.firstName;
    document.getElementById('editLastName').value = user.lastName;
    document.getElementById('editAge').value = user.age;
    document.getElementById('editEmail').value = user.email;

    const editRoleSelect = document.getElementById('editRoles');
    Array.from(editRoleSelect.options).forEach(opt => {
      opt.selected = user.roles.some(r => r.name === opt.value);
    });

    new bootstrap.Modal(document.getElementById('editModal')).show();
  }

  // Сохранение изменений пользователя
  document.getElementById('editUserForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = {
      id: parseInt(document.getElementById('editUserId').value),
      firstName: document.getElementById('editFirstName').value,
      lastName: document.getElementById('editLastName').value,
      age: parseInt(document.getElementById('editAge').value),
      email: document.getElementById('editEmail').value,
      username: document.getElementById('editEmail').value,
      password: document.getElementById('editPassword').value,
      roles: Array.from(document.getElementById('editRoles').selectedOptions)
              .map(opt => ({ name: opt.value }))
    };

    fetch(`/api/admin/users/${formData.id}`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        [csrfHeader]: csrfToken
      },
      body: JSON.stringify(formData)
    }).then(() => {
      new bootstrap.Modal(document.getElementById('editModal')).hide();
      fetchAllUsers();
    });
  });

  // Добавление нового пользователя
  document.getElementById('newUserForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = {
      firstName: document.getElementById('newFirstName').value,
      lastName: document.getElementById('newLastName').value,
      age: parseInt(document.getElementById('newAge').value),
      email: document.getElementById('newEmail').value,
      username: document.getElementById('newEmail').value,
      password: document.getElementById('newPassword').value,
      roles: Array.from(document.getElementById('newRoles').selectedOptions)
              .map(opt => ({ name: opt.value }))
    };

    fetch('/api/admin/users', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        [csrfHeader]: csrfToken
      },
      body: JSON.stringify(formData)
    }).then(() => {
      new bootstrap.Modal(document.getElementById('newUserModal')).hide();
      fetchAllUsers();
    });
  });

  // Удаление пользователя
  window.currentDeleteId = null;

  function confirmDelete() {
    if (!window.currentDeleteId) return;

    fetch(`/api/admin/users/${window.currentDeleteId}`, {
      method: 'DELETE',
      headers: {
        [csrfHeader]: csrfToken
      }
    }).then(() => {
      new bootstrap.Modal(document.getElementById('deleteModal')).hide();
      fetchAllUsers();
    });
  }

  // Инициализация при загрузке страницы
  document.addEventListener("DOMContentLoaded", () => {
    fetchAllUsers();
    fetchAllRoles();
  });
</script>
</body>
</html>
