<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"  rel="stylesheet">
  <style>
    .sidebar { position: fixed; top: 60px; bottom: 0; left: 0; width: 250px; padding: 20px; background-color: #f8f9fa; }
    .content { margin-left: 250px; padding: 40px 20px; }
    .table-responsive { max-height: calc(100vh - 200px); overflow-y: auto; }
  </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark sticky-top">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Admin Panel</span>
    <span class="navbar-text me-auto" sec:authentication="name"></span>
    <form th:action="@{/logout}" method="post">
     <button type="submit" class="btn btn-danger">Logout</button>
    </form>
  </div>
</nav>

<div class="d-flex">
  <!-- Sidebar -->
  <div class="sidebar">
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link active" th:href="@{/admin}">Admin</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/user}">User</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="content w-100">
    <h3>All Users</h3>
    <table class="table table-striped table-hover">
      <thead class="table-dark">
      <tr>
        <th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Roles</th><th>Edit</th><th>Delete</th>
      </tr>
      </thead>
      <tbody id="userTableBody">
      <!-- Данные будут добавлены через JS -->
      </tbody>
    </table>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editForm">
        <div class="modal-header">
          <h5 class="modal-title">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editUserId">
          <div class="mb-3"><label>First Name</label><input class="form-control" id="editFirstName" required></div>
          <div class="mb-3"><label>Last Name</label><input class="form-control" id="editLastName" required></div>
          <div class="mb-3"><label>Age</label><input type="number" class="form-control" id="editAge" required></div>
          <div class="mb-3"><label>Email</label><input class="form-control" id="editEmail" required></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Delete User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this user?</p>
        <p>ID: <span id="deleteUserIdText"></span></p>
        <p>Name: <span id="deleteUserNameText"></span></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let selectedUserId = null;

  async function loadUsers() {
    const response = await fetch('/api/admin/users');
    const users = await response.json();
    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = '';

    users.forEach(user => {
      const row = document.createElement('tr');
      row.innerHTML = `
            <td>${user.id}</td>
            <td>${user.firstName}</td>
            <td>${user.lastName}</td>
            <td>${user.age}</td>
            <td>${user.email}</td>
            <td>${user.roles.map(r => r.name).join(', ')}</td>
            <td><button class="btn btn-sm btn-outline-primary" onclick="openEditModal(${user.id})">Edit</button>
            <td><button class="btn btn-sm btn-outline-danger" onclick='openDeleteModal(${JSON.stringify(user)})'>Delete</button></td>
        `;
      tbody.appendChild(row);
    });
  }

  document.getElementById('editForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const user = {
      id: +document.getElementById('editUserId').value,
      firstName: document.getElementById('editFirstName').value,
      lastName: document.getElementById('editLastName').value,
      age: +document.getElementById('editAge').value,
      email: document.getElementById('editEmail').value
    };

    const response = await fetch(`/api/admin/users/${user.id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(user)
    });

    if (response.ok) {
      bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
      loadUsers();
    }
  });

  async function openEditModal(userId) {
    const response = await fetch(`/api/admin/users/${userId}`);
    const user = await response.json();

    document.getElementById('editUserId').value = user.id;
    document.getElementById('editFirstName').value = user.firstName;
    document.getElementById('editLastName').value = user.lastName;
    document.getElementById('editAge').value = user.age;
    document.getElementById('editEmail').value = user.email;

    new bootstrap.Modal(document.getElementById('editModal')).show();
  }

  function openDeleteModal(user) {
    selectedUserId = user.id;
    document.getElementById('deleteUserIdText').textContent = user.id;
    document.getElementById('deleteUserNameText').textContent = `${user.firstName} ${user.lastName}`;
    new bootstrap.Modal(document.getElementById('deleteModal')).show();
  }

  async function confirmDelete() {
    const response = await fetch(`/api/admin/users/${selectedUserId}`, {
      method: 'DELETE'
    });
    if (response.ok) {
      bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
      loadUsers();
    }
  }

  window.onload = loadUsers;
</script>
</body>
</html>
