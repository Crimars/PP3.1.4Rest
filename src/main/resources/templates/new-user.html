<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>New User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"  rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h3>Add New User</h3>
    <form id="createForm">
        <div class="mb-3"><label>First Name</label><input class="form-control" id="firstName" required></div>
        <div class="mb-3"><label>Last Name</label><input class="form-control" id="lastName" required></div>
        <div class="mb-3"><label>Age</label><input type="number" class="form-control" id="age" required></div>
        <div class="mb-3"><label>Email</label><input class="form-control" id="email" required></div>
        <div class="mb-3"><label>Password</label><input type="password" class="form-control" id="password" required></div>
        <button type="submit" class="btn btn-primary">Create</button>
    </form>
</div>
<script>
    document.getElementById('createForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const user = {
            firstName: document.getElementById('firstName').value,
            lastName: document.getElementById('lastName').value,
            age: +document.getElementById('age').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };
        const res = await fetch('/api/admin/users', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(user)
        });
        if (res.ok) {
            window.location.href = '/admin';
        }
    });
</script>
</body>
</html>
