<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Information</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"  rel="stylesheet">

    <style>
        .sidebar {
            position: fixed;
            top: 60px;
            bottom: 0;
            left: 0;
            width: 250px;
            padding: 20px;
            background-color: #f8f9fa;
            overflow-y: auto;
            border-right: 1px solid #dee2e6;
        }

        .content {
            margin-left: 250px; /* Отступ под боковое меню */
            padding-top: 60px; /* Отступ под шапку */
        }

        .nav-link.active {
            background-color: #0d6efd !important;
            color: white !important;
        }

        .logout-btn {
            float: right;
            margin: 10px 20px 0 0;
        }

        .user-card {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .user-header {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .user-table th {
            width: 20%;
            text-align: left;
            padding: 10px;
            background-color: #f8f9fa;
        }

        .user-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">User Panel</span>
        <span class="navbar-text me-auto" sec:authentication="name"></span>

        <!-- Форма выхода -->
        <form class="logout-btn" th:action="@{/logout}" method="post">
            <!-- Убран CSRF токен — если защита отключена -->
            <button type="submit" class="btn btn-danger">Logout</button>
        </form>
    </div>
</nav>

<div class="d-flex">

    <!-- Боковое меню -->
    <div class="sidebar">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin}">Admin</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" th:href="@{/user}">User</a>
            </li>
        </ul>
    </div>

    <!-- Основной контент -->
    <div class="content">
        <div class="user-card">
            <div class="user-header">
                <h1 class="text-center">User Information</h1>
            </div>

            <h3 class="mb-4">About You</h3>

            <!-- Таблица данных пользователя -->
            <table class="user-table table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Age</th>
                    <th>Email</th>
                    <th>Role(s)</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <!-- Проверка на null -->
                    <td th:text="${user?.id ?: 'N/A'}"></td>
                    <td th:text="${user?.firstName ?: 'N/A'}"></td>
                    <td th:text="${user?.lastName ?: 'N/A'}"></td>
                    <td th:text="${user?.age ?: 'N/A'}"></td>
                    <td th:text="${user?.email ?: 'N/A'}"></td>
                    <td>
                        <!-- Безопасное отображение ролей -->
                        <span th:each="role : ${user?.roles}">
                                <span th:text="${role.name} + ' '"></span>
                            </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
